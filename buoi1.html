<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #0066cc;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Xin Chào Thế Giới! 👋</h1>
        <p>Đây là trang web HTML đầu tiên do chính tay bạn tạo ra.</p>
        <p>Chúc bạn có những bước khởi đầu thuận lợi trên con đường học lập trình web!</p>
    </div>

</body>
</html>
